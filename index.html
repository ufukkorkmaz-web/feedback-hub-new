<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPT Feedback</title>
  <script>document.documentElement.classList.add("js")</script>
  <meta name="theme-color" content="#0b1230">
  <meta name="apple-mobile-web-app-title" content="IPT Feedback">
  <link rel="apple-touch-icon" href="assets/logo-menu.png">
  <link rel="preload" as="image" href="assets/logo-menu.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    .menu-layout{display:grid;gap:1.5rem;grid-template-columns:1fr;width:100%}
    .menu-hub{order:1;min-width:0}
    .menu-actions{order:2;display:flex;flex-direction:column;gap:1rem;min-width:0}
    .menu-buttons{display:grid;gap:1rem;grid-template-columns:1fr 1fr;flex:1}
    .menu-buttons .menu-option{min-height:0}
    .menu-right{order:3;display:flex;min-width:0}
    .menu-extra{order:4;display:flex;min-width:0}
    @media(min-width:1024px){
      #menu-view.active{display:flex;align-items:center;min-height:100vh}
      .menu-layout{grid-template-columns:1fr 1fr;align-items:stretch}
      .menu-hub,.menu-actions,.menu-right,.menu-extra{order:0}
    }
    @media(max-width:640px){.menu-buttons{grid-template-columns:1fr}}
    .meet-card{width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:.7rem;padding:1.1rem 1.5rem;color:var(--t-label)}
    .meet-title{margin:0;font-size:22px;font-weight:700;color:var(--t-title)}
    .meet-sub{margin:.2rem 0 0;font-size:14px;line-height:1.5;color:var(--t-intro)}
    .meet-list{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
    .meet-row{display:flex;align-items:center;gap:.9rem;padding:.5rem .9rem;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.07)}
    .meet-chip{min-width:4.75rem;text-align:center;font-size:14px;font-weight:700;padding:.3rem .8rem;border-radius:999px}
    .meet-chip-6{background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67}
    .meet-chip-7{background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff}
    .meet-day{font-size:14px;color:var(--t-help)}
    .meet-time{margin-left:auto;font-size:18px;font-weight:700;color:var(--t-title);font-variant-numeric:tabular-nums;white-space:nowrap}
    .meet-btn{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 1.25rem;border-radius:18px;background:linear-gradient(135deg,#52d9ca,#658ff1);color:#06214e;font-size:16px;font-weight:700;text-decoration:none;box-shadow:0 8px 22px rgba(82,217,202,.25);transition:transform .15s ease,filter .15s ease}
    .meet-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .meet-btn:focus-visible{outline:2px solid #ffd54a;outline-offset:3px}
    .meet-btn svg{width:22px;height:22px;flex:none}
    @media(prefers-reduced-motion:reduce){.meet-btn{transition:none}.meet-btn:hover{transform:none}}
    .fw-card{padding:.8rem 1rem;display:flex;flex-direction:column;gap:.5rem;color:var(--t-label)}
    .fw-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
    .fw-title{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9decE5}
    .fw-date{font-size:13px;font-weight:600;color:var(--t-help);white-space:nowrap}
    .fw-row{display:flex;align-items:center;gap:.75rem}
    .fw-chip{flex:none;min-width:4.25rem;text-align:center;font-size:13px;font-weight:700;padding:.2rem .65rem;border-radius:999px}
    .fw-chip-6{background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67}
    .fw-chip-7{background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff}
    .fw-schools{font-size:14px;font-weight:600;line-height:1.35;color:var(--t-title)}
    .meet-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meet-row.is-next,.meet-row.is-live{border-color:rgba(121,235,221,.6);background:rgba(121,235,221,.12)}
    .meet-dot{display:inline-block;width:8px;height:8px;margin-right:.5rem;border-radius:50%;background:#5df0a0;animation:meetPulse 1.6s infinite}
    @keyframes meetPulse{0%{box-shadow:0 0 0 0 rgba(93,240,160,.55)}70%{box-shadow:0 0 0 8px rgba(93,240,160,0)}100%{box-shadow:0 0 0 0 rgba(93,240,160,0)}}
    .meet-btn.is-soon{animation:meetGlow 2s ease-in-out infinite}
    @keyframes meetGlow{0%,100%{box-shadow:0 8px 22px rgba(82,217,202,.25)}50%{box-shadow:0 8px 30px rgba(82,217,202,.65),0 0 0 4px rgba(121,235,221,.25)}}
    @media(prefers-reduced-motion:reduce){.meet-dot,.meet-btn.is-soon{animation:none}.meet-btn.is-soon{box-shadow:0 8px 30px rgba(82,217,202,.6)}}
    .meet-banner{display:flex;flex-direction:column;gap:.1rem;margin-top:.55rem;padding:.5rem .9rem;border-radius:16px;border:1px solid rgba(121,235,221,.5);background:linear-gradient(135deg,rgba(82,217,202,.22),rgba(101,143,241,.28));box-shadow:0 0 22px rgba(82,217,202,.22),inset 0 1px 0 rgba(255,255,255,.18)}
    .meet-banner-label{display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9decE5}
    .meet-banner-main{font-size:18px;font-weight:700;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px rgba(157,236,229,.45)}
    .meet-banner.is-live{border-color:rgba(93,240,160,.7);background:linear-gradient(135deg,rgba(93,240,160,.24),rgba(82,217,202,.28));box-shadow:0 0 26px rgba(93,240,160,.32),inset 0 1px 0 rgba(255,255,255,.2)}
    .meet-banner.is-soon{animation:bannerGlow 2s ease-in-out infinite}
    @keyframes bannerGlow{0%,100%{box-shadow:0 0 18px rgba(82,217,202,.25),inset 0 1px 0 rgba(255,255,255,.18)}50%{box-shadow:0 0 32px rgba(82,217,202,.65),inset 0 1px 0 rgba(255,255,255,.18)}}
    @media(prefers-reduced-motion:reduce){.meet-banner.is-soon{animation:none;box-shadow:0 0 30px rgba(82,217,202,.55),inset 0 1px 0 rgba(255,255,255,.18)}}
    /* Bigger, better-centered logos */
    .menu-hub img{width:7rem;height:7rem;object-fit:contain;margin-left:auto;margin-right:auto}
    @media(min-width:640px){
      .year-header img{width:clamp(8rem,14vw,11.5rem);height:auto;aspect-ratio:1/1;flex:none;align-self:center;margin-right:clamp(0rem,1.6vw,1.5rem)}
    }

    /* ===== Intro: glass Saturn spins in, then a circle of light opens and reveals the site ===== */
    @property --r{syntax:"<length>";inherits:true;initial-value:0px}
    #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
      background:radial-gradient(circle at 14% 12%,rgba(114,242,217,.40),transparent 27%),radial-gradient(circle at 86% 16%,rgba(151,182,255,.39),transparent 27%),linear-gradient(135deg,#020c27,#173067);
      animation:introReveal .95s cubic-bezier(.65,0,.35,1) 1.15s forwards;
      -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px));mask-image:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px))}
    #intro.skip{animation:introSkip .35s ease forwards}
    .intro-orb{position:absolute;border-radius:50%;filter:blur(5px);opacity:.5;animation:drift 9s ease-in-out infinite alternate}
    .intro-orb.o1{width:210px;height:210px;right:-52px;top:7%;background:#7df4df}
    .intro-orb.o2{width:260px;height:260px;left:4%;bottom:-120px;background:#7992ff;animation-delay:-3s}
    .intro-stage{position:relative;display:grid;place-items:center}
    .intro-stage>*{grid-area:1/1}
    .saturn{width:min(34vw,9rem);height:auto;opacity:0;filter:drop-shadow(0 0 18px rgba(121,235,221,.35));
      animation:saturnIn 1s cubic-bezier(.2,.8,.2,1) .1s forwards}
    .saturn-sheen{animation:saturnSheen 1.1s ease-in-out infinite}
    @keyframes saturnIn{0%{opacity:0;transform:scale(.6) rotate(-180deg)}40%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes saturnSheen{from{transform:translateX(0)}to{transform:translateX(90px)}}
    @keyframes introReveal{from{--r:0px}to{--r:var(--max,1400px)}}
    .intro-ring{position:absolute;left:50%;top:50%;width:calc(var(--r)*2 + 8px);height:calc(var(--r)*2 + 8px);transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(190,255,247,.95);box-shadow:0 0 28px 6px rgba(121,235,221,.55),0 0 90px 20px rgba(121,235,221,.25);pointer-events:none;opacity:0;animation:ringLife .95s ease 1.15s both}
    @keyframes ringLife{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
    @keyframes introSkip{to{opacity:0;visibility:hidden}}
    @media(prefers-reduced-motion:reduce){#intro{display:none}}
    /* ===== Staggered entrance: boxes rise in one after another ===== */
    .js body:not(.page-ready) .rise{opacity:0}
    .page-ready .rise{animation:riseIn .7s cubic-bezier(.2,.8,.2,1) calc(var(--i,0)*90ms) backwards}
    @keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.js body:not(.page-ready) .rise{opacity:1}.page-ready .rise{animation:none}}
    /* ===== Mini Saturn moment when opening Year 6 / Year 7 ===== */
    .sat-wash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;pointer-events:none;opacity:0;
      background:radial-gradient(circle at 50% 50%,var(--glow,rgba(121,235,221,.28)),transparent 46%),linear-gradient(135deg,#020c27,#173067)}
    .sat-wash.in{animation:satWashIn .22s ease forwards}
    .sat-wash.out{animation:satWashOut .38s ease forwards}
    @keyframes satWashIn{to{opacity:1}}
    @keyframes satWashOut{from{opacity:1}to{opacity:0}}
    .sat-mini{width:min(26vw,5.5rem);height:auto;filter:drop-shadow(0 0 16px var(--glow2,rgba(121,235,221,.45)));animation:saturnIn .5s cubic-bezier(.2,.8,.2,1) .05s both}
    .a2hs{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;width:min(420px,calc(100% - 24px));margin:0 auto;display:none;align-items:center;gap:.75rem;padding:.75rem .85rem;border-radius:20px;background:rgba(3,14,44,.94);border:1px solid var(--edge);box-shadow:0 12px 30px rgba(0,0,0,.4);backdrop-filter:blur(12px);color:var(--t-label)}
    .a2hs.is-visible{display:flex;animation:a2hsIn .35s ease both}
    @keyframes a2hsIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .a2hs-icon{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#52d9ca,#658ff1);color:#06214e}
    .a2hs-icon svg{width:22px;height:22px}
    .a2hs-text{display:flex;flex-direction:column;gap:.15rem;flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--t-intro)}
    .a2hs-text strong{font-size:14px;color:var(--t-title)}
    .a2hs-text b{color:var(--t-title);font-weight:600}
    .a2hs-text svg{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;color:#9decE5}
    .a2hs-close{flex:none;display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.1);color:var(--t-title);font-size:18px;line-height:1;cursor:pointer}
    .a2hs-close:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
    #menu-view.has-a2hs{padding-bottom:7rem}
    @media(prefers-reduced-motion:reduce){.a2hs.is-visible{animation:none}}
  </style>
</head>

          <img class="mx-auto mb-3 h-24 w-24 object-contain" src="assets/logo-menu.png" alt="IPT logo">

  <!-- The two form views are generated by script.js from the config at the top of that file -->

  <script src="script.js"></script>
  <script src="calendar.js"></script>
  <script id="meeting-status">
    /* Live "next meeting" line for the meetings box. Times come from the data-* attributes on the rows above. */
    (function () {
      const card = document.querySelector(".meet-card");
      if (!card) return;
      const TZ = "Europe/Istanbul";                       // meeting times are read in this time zone
      const banner = card.querySelector(".meet-banner"), btn = card.querySelector(".meet-btn");
      const labelEl = banner.querySelector(".meet-banner-label"), mainEl = banner.querySelector(".meet-banner-main");
      const SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      const W = 7 * 1440;
      const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
      const rows = [...card.querySelectorAll(".meet-row[data-start]")];
      const slots = rows.map(row => {
        const day = SHORT.indexOf(row.dataset.day);
        return { row, day, label: row.querySelector(".meet-chip").textContent.trim(),
                 startTxt: row.dataset.start, endTxt: row.dataset.end,
                 start: day * 1440 + toMin(row.dataset.start), end: day * 1440 + toMin(row.dataset.end) };
      });

      /*compute-start*/
      function compute(now, slots) {
        const live = slots.find(s => now >= s.start && now < s.end);
        if (live) return { live: true, slot: live, diff: 0 };
        let best = null;
        for (const s of slots) {
          let d = s.start - now; if (d <= 0) d += W;
          if (!best || d < best.diff) best = { live: false, slot: s, diff: d };
        }
        return best;
      }
      function describe(now, r) {
        const s = r.slot;
        if (r.live) return { live: true, label: "Live now", main: `${s.label} \u00b7 until ${s.endTxt}` };
        let main;
        if (r.diff <= 180) {
          const h = Math.floor(r.diff / 60), m = r.diff % 60, p = [];
          if (h) p.push(h + " h"); if (m || !h) p.push(m + " min");
          main = `${s.label} \u00b7 in ${p.join(" ")}`;
        } else {
          const nowDay = Math.floor(now / 1440) % 7, ahead = (s.day - nowDay + 7) % 7;
          if (r.diff < 1440 && ahead === 0) main = `${s.label} \u00b7 today at ${s.startTxt}`;
          else if (r.diff < 2880 && ahead === 1) main = `${s.label} \u00b7 tomorrow at ${s.startTxt}`;
          else main = `${s.label} \u00b7 ${LONG[s.day]} ${s.startTxt}`;
        }
        return { live: false, label: "Next meeting", main };
      }
      /*compute-end*/

      function nowInTZ() {                                // minutes since Monday 00:00 in the meeting time zone
        let d = new Date(), day, hh, mm;
        try {
          const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d);
          const g = t => p.find(x => x.type === t).value;
          day = SHORT.indexOf(g("weekday")); hh = Number(g("hour")) % 24; mm = Number(g("minute"));
        } catch (e) { day = (d.getDay() + 6) % 7; hh = d.getHours(); mm = d.getMinutes(); }
        return day * 1440 + hh * 60 + mm;
      }

      function update() {
        const now = nowInTZ(), r = compute(now, slots);
        if (!r) return;
        const d = describe(now, r);
        labelEl.textContent = "";
        if (r.live) { const dot = document.createElement("span"); dot.className = "meet-dot"; labelEl.appendChild(dot); }
        labelEl.appendChild(document.createTextNode(d.label));
        mainEl.textContent = d.main;
        slots.forEach(s => s.row.classList.remove("is-live", "is-next"));
        if (r.live) r.slot.row.classList.add("is-live");
        else if (r.diff < 1440) r.slot.row.classList.add("is-next");
        const soon = r.live || r.diff <= 15;
        banner.classList.toggle("is-live", r.live);
        banner.classList.toggle("is-soon", soon);
        btn.classList.toggle("is-soon", soon);
      }
      update();
      setInterval(update, 30000);
      document.addEventListener("visibilitychange", update);
    })();
  </script>
  <script id="fit-viewport">
    /* Fits the home page to the screen on desktop: shrinks it on short screens and enlarges it on big ones
       (up to MAX_SCALE), keeping a margin around the edges so it never scrolls. Phones/tablets are untouched. */
    (function () {
      const MAX_SCALE = 1.5;                               // biggest enlargement allowed (1.5 = 150%)
      const main = document.getElementById("menu-view");
      const layout = main && main.querySelector(".menu-layout");
      if (!layout) return;
      function fit() {
        layout.style.zoom = "";
        if (window.innerWidth < 1024 || !layout.offsetHeight) return;
        const cs = getComputedStyle(main);
        const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
        const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
        const availH = window.innerHeight - Math.max(padY, window.innerHeight * 0.09) - 2;   // at least ~4.5% margin top and bottom
        const availW = Math.min(main.clientWidth - padX, window.innerWidth * 0.93);          // at least ~3.5% margin left and right
        const baseW = parseFloat(getComputedStyle(layout).maxWidth) || 1152;
        const zh = availH / layout.getBoundingClientRect().height;
        const z = zh < 1 ? Math.max(zh, 0.5) : Math.min(zh, Math.max(1, availW / baseW), MAX_SCALE);
        if (Math.abs(z - 1) > 0.005) layout.style.zoom = z;
      }
      window.addEventListener("resize", fit);
      window.addEventListener("load", fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      new MutationObserver(fit).observe(main, { attributes: true, attributeFilter: ["class"] });
      fit();
    })();
  </script>
<script id="intro-script">
    /* Intro: Saturn spins, then a circle of light opens from the centre and reveals the page.
       Click, tap, Esc, Enter or Space skips it. It also starts the staggered entrance of the boxes. */
    (function () {
      var intro = document.getElementById("intro");
      var ready = function () { document.body.classList.add("page-ready"); };
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!intro || reduce) { ready(); if (intro) intro.remove(); return; }
      intro.style.setProperty("--max", (Math.hypot(window.innerWidth, window.innerHeight) / 2 + 90) + "px");
      var t = setTimeout(ready, 1250);                     // boxes start rising as the circle opens
      function done() { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); intro = null; }
      function skip() { if (!intro) return; clearTimeout(t); ready(); intro.classList.add("skip"); }
      intro.addEventListener("animationend", function (e) { if (e.target === intro) done(); });
      intro.addEventListener("click", skip);
      document.addEventListener("keydown", function (e) { if (intro && (e.key === "Escape" || e.key === "Enter" || e.key === " ")) skip(); });
      setTimeout(ready, 4000);   // safety nets
      setTimeout(done, 5000);
    })();
  </script>
  <script id="saturn-transition">
    /* Mini Saturn: clicking Year 6 / Year 7 shows a quick spinning Saturn (like the intro), opens the form
       underneath, then fades away. Skipped for people who prefer reduced motion. */
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var GLOW = { "open-year6": ["rgba(255,243,123,.30)", "rgba(255,243,123,.60)"], "open-year7": ["rgba(101,143,241,.38)", "rgba(121,235,221,.50)"] };
      var SATURN = '<svg class="sat-mini" viewBox="0 0 200 140" aria-hidden="true"><defs>' +
        '<radialGradient id="ms-body" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".35" stop-color="#bff7ee" stop-opacity=".45"/><stop offset="1" stop-color="#5a78ff" stop-opacity=".35"/></radialGradient>' +
        '<linearGradient id="ms-ring" x1="0" x2="1"><stop offset="0" stop-color="#79ebdd" stop-opacity=".1"/><stop offset=".5" stop-color="#eaffff" stop-opacity=".95"/><stop offset="1" stop-color="#9bb2ff" stop-opacity=".1"/></linearGradient>' +
        '<linearGradient id="ms-sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
        '<clipPath id="ms-clip"><circle cx="100" cy="70" r="34"/></clipPath></defs>' +
        '<g transform="rotate(-18 100 70)">' +
        '<path d="M16 70A84 20 0 0 1 184 70" fill="none" stroke="url(#ms-ring)" stroke-width="5" opacity=".6"/>' +
        '<path d="M34 70A66 15.5 0 0 1 166 70" fill="none" stroke="url(#ms-ring)" stroke-width="1.6"/>' +
        '<circle cx="100" cy="70" r="34" fill="url(#ms-body)" stroke="rgba(225,244,255,.55)" stroke-width="1.2"/>' +
        '<g clip-path="url(#ms-clip)"><g class="saturn-sheen"><rect x="46" y="30" width="18" height="80" fill="url(#ms-sheen)" transform="skewX(-18)"/></g></g>' +
        '<ellipse cx="88" cy="56" rx="9" ry="4.5" fill="#fff" opacity=".55" transform="rotate(-25 88 56)"/>' +
        '<path d="M16 70A84 20 0 0 0 184 70" fill="none" stroke="url(#ms-ring)" stroke-width="5" opacity=".75"/>' +
        '<path d="M34 70A66 15.5 0 0 0 166 70" fill="none" stroke="url(#ms-ring)" stroke-width="1.6"/></g></svg>';
      var busy = false, bypass = false;
      document.addEventListener("click", function (e) {
        var btn = e.target.closest && e.target.closest("#open-year6, #open-year7");
        if (!btn || bypass || reduce) return;
        e.stopImmediatePropagation(); e.preventDefault();
        if (busy) return;
        busy = true;
        var g = GLOW[btn.id] || GLOW["open-year7"];
        var el = document.createElement("div");
        el.className = "sat-wash";
        el.setAttribute("aria-hidden", "true");
        el.style.setProperty("--glow", g[0]);
        el.style.setProperty("--glow2", g[1]);
        el.innerHTML = SATURN;
        document.body.appendChild(el);
        el.classList.add("in");
        setTimeout(function () {
          bypass = true; btn.click(); bypass = false;      // open the form underneath
          el.classList.remove("in"); el.classList.add("out");
          setTimeout(function () { el.remove(); busy = false; }, 400);
        }, 650);
      }, true);
    })();
  </script>
  <script id="home-screen-hint">
    /* Small "Add to home screen" tip for phones. Shown once; closing it hides it for good.
       To test on a computer, open the site with ?a2hs=ios or ?a2hs=android at the end of the address. */
    (function () {
      const main = document.getElementById("menu-view");
      if (!main) return;
      const KEY = "ipt-a2hs-dismissed";
      const ua = navigator.userAgent || "";
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);
      const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
      const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
      const PLUS = svg('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>');
      const SHARE = svg('<path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>');
      const STEPS = {
        ios: `Tap ${SHARE} <b>Share</b>, then <b>Add to Home Screen</b>.`,
        android: `Tap the <b>\u22ee</b> menu, then <b>Add to Home screen</b>.`,
        other: `Open your browser menu and choose <b>Add to Home screen</b>.`
      };
      let dismissed = false;
      try { dismissed = !!localStorage.getItem(KEY); } catch (e) {}

      const el = document.createElement("div");
      el.className = "a2hs";
      el.setAttribute("role", "region");
      el.setAttribute("aria-label", "Add to home screen");
      main.appendChild(el);

      function hide(remember) {
        el.classList.remove("is-visible");
        main.classList.remove("has-a2hs");
        if (remember) { try { localStorage.setItem(KEY, "1"); } catch (e) {} }
      }
      function show(platform, force) {
        const phone = window.innerWidth < 1024;
        if (!force && (!(isIOS || isAndroid) || !phone || standalone || dismissed)) return;
        el.innerHTML = `<span class="a2hs-icon">${PLUS}</span>` +
          `<div class="a2hs-text"><strong>Add this page to your home screen</strong><span>${STEPS[platform] || STEPS.other}</span></div>` +
          `<button type="button" class="a2hs-close" aria-label="Dismiss">\u00d7</button>`;
        el.querySelector(".a2hs-close").addEventListener("click", () => hide(true));
        el.classList.add("is-visible");
        if (phone) main.classList.add("has-a2hs");
      }
      window.showHomeScreenHint = p => show(p || "ios", true);

      const test = new URLSearchParams(location.search).get("a2hs");
      if (test) setTimeout(() => show(test, true), 600);
      else setTimeout(() => show(isIOS ? "ios" : isAndroid ? "android" : "other", false), 3400);
    })();
  </script>
