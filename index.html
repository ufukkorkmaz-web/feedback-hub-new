<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPT Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    .menu-layout{display:grid;gap:1.5rem;grid-template-columns:1fr;width:100%}
    .menu-hub{order:1;min-width:0}
    .menu-buttons{order:2;display:grid;gap:1rem;grid-template-columns:1fr 1fr}
    .menu-buttons .menu-option{min-height:0}
    .menu-right{order:3;display:flex;min-width:0}
    .menu-extra{order:4;display:flex;min-width:0}
    @media(min-width:1024px){
      #menu-view.active{display:flex;align-items:center;min-height:100vh}
      .menu-layout{grid-template-columns:1fr 1fr;align-items:stretch}
      .menu-hub,.menu-buttons,.menu-right,.menu-extra{order:0}
    }
    @media(max-width:640px){.menu-buttons{grid-template-columns:1fr}}
  </style>
</head>
<body style="background: linear-gradient(90deg, rgb(0,0,0), rgb(53,51,205));">
  <div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>
  <img class="aurora-image" src="https://images.pexels.com/photos/7130560/pexels-photo-7130560.jpeg?auto=compress&cs=tinysrgb&w=1920" alt="Soft pastel gradient with pink and blue hues">
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main id="menu-view" class="view active w-full px-4 py-6 sm:px-7">
    <div class="menu-layout mx-auto max-w-6xl">
      <div class="glass-panel menu-hub rounded-[28px] px-6 py-5 text-center" style="background:transparent;">
          <img class="mx-auto mb-3 h-24 w-24 object-contain" src="assets/logo-menu.png" alt="IPT logo">
          <p class="mb-2 font-bold uppercase" style="color:#9decE5;font-size:22px;letter-spacing:.12rem;">Teacher reflection hub</p>
          <h1 class="font-semibold" style="color:#f4f9ff;font-weight:700;font-size:30px;">IPT Feedback</h1>
          <p class="mx-auto mt-2 max-w-xl leading-relaxed" style="color:#d6e4f7;font-size:16px;line-height:1.5;">Choose the year level you are giving feedback for.</p>
      </div>
      <div id="schedule" class="menu-right"></div>
        <section class="menu-buttons" aria-label="Choose a feedback year">
          <button id="open-year6" type="button" class="menu-option rounded-[26px] p-5 text-left shadow-2xl" style="background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67;">
            <span class="relative z-10 block font-bold uppercase tracking-[.14em]" style="color:#076eaa;font-size:13px;">Bright ideas ahead</span>
            <span class="relative z-10 mt-2 block font-semibold" style="color:#073d67;font-weight:700;font-size:30px;">Year 6</span>
            <span class="relative z-10 mt-2 block leading-relaxed" style="color:#155b83;font-size:14px;">Share vibrant reflections on your Year 6 IPT teaching experience.</span>
            <span class="relative z-10 mt-4 inline-flex items-center gap-2 font-bold"><i data-lucide="sparkles" aria-hidden="true"></i><span style="color:#073d67;font-size:15px;">Give Year 6 feedback</span></span>
          </button>
          <button id="open-year7" type="button" class="menu-option rounded-[26px] p-5 text-left shadow-2xl" style="background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff;">
            <span class="relative z-10 block font-bold uppercase tracking-[.14em]" style="color:#9decE5;font-size:13px;">Reflect and refine</span>
            <span class="relative z-10 mt-2 block font-semibold" style="color:#f4f9ff;font-weight:700;font-size:30px;">Year 7</span>
            <span class="relative z-10 mt-2 block leading-relaxed" style="color:#d6e4f7;font-size:14px;">Continue to the familiar Year 7 IPT feedback experience.</span>
            <span class="relative z-10 mt-4 inline-flex items-center gap-2 font-bold"><i data-lucide="arrow-right" aria-hidden="true"></i><span style="color:#effcff;font-size:15px;">Give Year 7 feedback</span></span>
          </button>
        </section>
      <div id="extra" class="menu-extra">
        <div class="glass-panel rounded-[28px] px-6 py-5" style="width:100%;">
          <h2 style="color:var(--t-title);font-size:22px;font-weight:700;">New section</h2>
          <p class="mt-2" style="color:var(--t-intro);font-size:15px;line-height:1.5;">Replace this text with whatever you want to show here.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- The two form views are generated by script.js from the config at the top of that file -->
  <div id="year6-view" class="view year6-theme"></div>
  <div id="year7-view" class="view"></div>

  <script src="script.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
