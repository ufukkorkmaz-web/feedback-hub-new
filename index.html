<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPT Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    .menu-layout{display:grid;gap:1.5rem;grid-template-columns:1fr;width:100%}
    .menu-hub{order:1;min-width:0}
    .menu-actions{order:2;display:flex;flex-direction:column;gap:1rem;min-width:0}
    .menu-buttons{display:grid;gap:1rem;grid-template-columns:1fr 1fr;flex:1}
    .menu-buttons .menu-option{min-height:0}
    .menu-right{order:3;display:flex;min-width:0}
    .menu-extra{order:4;display:flex;min-width:0}
    @media(min-width:1024px){
      #menu-view.active{display:flex;align-items:center;min-height:100vh}
      .menu-layout{grid-template-columns:1fr 1fr;align-items:stretch}
      .menu-hub,.menu-actions,.menu-right,.menu-extra{order:0}
    }
    @media(max-width:640px){.menu-buttons{grid-template-columns:1fr}}
    .meet-card{width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:.85rem;padding:1.1rem 1.5rem;color:var(--t-label)}
    .meet-title{margin:0;font-size:22px;font-weight:700;color:var(--t-title)}
    .meet-sub{margin:.2rem 0 0;font-size:14px;line-height:1.5;color:var(--t-intro)}
    .meet-list{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
    .meet-row{display:flex;align-items:center;gap:.9rem;padding:.65rem .9rem;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.07)}
    .meet-chip{min-width:4.75rem;text-align:center;font-size:14px;font-weight:700;padding:.3rem .8rem;border-radius:999px}
    .meet-chip-6{background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67}
    .meet-chip-7{background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff}
    .meet-day{font-size:14px;color:var(--t-help)}
    .meet-time{margin-left:auto;font-size:18px;font-weight:700;color:var(--t-title);font-variant-numeric:tabular-nums;white-space:nowrap}
    .meet-btn{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 1.25rem;border-radius:18px;background:linear-gradient(135deg,#52d9ca,#658ff1);color:#06214e;font-size:16px;font-weight:700;text-decoration:none;box-shadow:0 8px 22px rgba(82,217,202,.25);transition:transform .15s ease,filter .15s ease}
    .meet-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .meet-btn:focus-visible{outline:2px solid #ffd54a;outline-offset:3px}
    .meet-btn svg{width:22px;height:22px;flex:none}
    @media(prefers-reduced-motion:reduce){.meet-btn{transition:none}.meet-btn:hover{transform:none}}
    .fw-card{padding:.8rem 1rem;display:flex;flex-direction:column;gap:.5rem;color:var(--t-label)}
    .fw-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
    .fw-title{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9decE5}
    .fw-date{font-size:13px;font-weight:600;color:var(--t-help);white-space:nowrap}
    .fw-row{display:flex;align-items:center;gap:.75rem}
    .fw-chip{flex:none;min-width:4.25rem;text-align:center;font-size:13px;font-weight:700;padding:.2rem .65rem;border-radius:999px}
    .fw-chip-6{background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67}
    .fw-chip-7{background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff}
    .fw-schools{font-size:14px;font-weight:600;line-height:1.35;color:var(--t-title)}
    .meet-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meet-row.is-next,.meet-row.is-live{border-color:rgba(121,235,221,.6);background:rgba(121,235,221,.12)}
    .meet-dot{display:inline-block;width:8px;height:8px;margin-right:.5rem;border-radius:50%;background:#5df0a0;animation:meetPulse 1.6s infinite}
    @keyframes meetPulse{0%{box-shadow:0 0 0 0 rgba(93,240,160,.55)}70%{box-shadow:0 0 0 8px rgba(93,240,160,0)}100%{box-shadow:0 0 0 0 rgba(93,240,160,0)}}
    .meet-btn.is-soon{animation:meetGlow 2s ease-in-out infinite}
    @keyframes meetGlow{0%,100%{box-shadow:0 8px 22px rgba(82,217,202,.25)}50%{box-shadow:0 8px 30px rgba(82,217,202,.65),0 0 0 4px rgba(121,235,221,.25)}}
    @media(prefers-reduced-motion:reduce){.meet-dot,.meet-btn.is-soon{animation:none}.meet-btn.is-soon{box-shadow:0 8px 30px rgba(82,217,202,.6)}}
  </style>
</head>
<body style="background: linear-gradient(90deg, rgb(0,0,0), rgb(53,51,205));">
  <div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>
  <img class="aurora-image" src="https://images.pexels.com/photos/7130560/pexels-photo-7130560.jpeg?auto=compress&cs=tinysrgb&w=1920" alt="Soft pastel gradient with pink and blue hues">
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main id="menu-view" class="view active w-full px-4 py-6 sm:px-7">
    <div class="menu-layout mx-auto max-w-6xl">
      <div class="glass-panel menu-hub rounded-[28px] px-6 py-5 text-center" style="background:transparent;">
          <img class="mx-auto mb-3 h-24 w-24 object-contain" src="assets/logo-menu.png" alt="IPT logo">
          <p class="mb-2 font-bold uppercase" style="color:#9decE5;font-size:22px;letter-spacing:.12rem;">Teacher reflection hub</p>
          <h1 class="font-semibold" style="color:#f4f9ff;font-weight:700;font-size:30px;">IPT Feedback</h1>
          <p class="mx-auto mt-2 max-w-xl leading-relaxed" style="color:#d6e4f7;font-size:16px;line-height:1.5;">Choose the year level you are giving feedback for.</p>
      </div>
      <div id="schedule" class="menu-right"></div>
      <div id="extra" class="menu-extra">
        <section class="glass-panel meet-card rounded-[28px]" aria-label="Online meetings">
          <div>
            <h2 class="meet-title">Online meetings</h2>
            <p class="meet-sub">Join on Google Meet at the times below.</p>
          </div>
          <ul class="meet-list">
            <li class="meet-row" data-day="Mon" data-start="16:45" data-end="17:15"><span class="meet-chip meet-chip-7">Year 7</span><span class="meet-day">Monday</span><span class="meet-time">16:45 – 17:15</span></li>
            <li class="meet-row" data-day="Mon" data-start="17:40" data-end="18:10"><span class="meet-chip meet-chip-6">Year 6</span><span class="meet-day">Monday</span><span class="meet-time">17:40 – 18:10</span></li>
          </ul>
          <a class="meet-btn" href="https://meet.google.com/ohd-bjdt-bdo" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
            <span>Join Meeting</span>
          </a>
        </section>
      </div>
      <div class="menu-actions">
        <section id="feedback-week" class="glass-panel fw-card rounded-[24px]" aria-live="polite" aria-label="Feedback schools for the coming Monday"></section>
        <section class="menu-buttons" aria-label="Choose a feedback year">
          <button id="open-year6" type="button" class="menu-option rounded-[26px] px-5 py-4 text-left shadow-2xl" style="background:linear-gradient(135deg,#fff37b,#67e8f9);color:#073d67;">
            <span class="relative z-10 block font-bold uppercase tracking-[.14em]" style="color:#076eaa;font-size:13px;">Bright ideas ahead</span>
            <span class="relative z-10 mt-2 block font-semibold" style="color:#073d67;font-weight:700;font-size:30px;">Year 6</span>
            <span class="relative z-10 mt-2 block leading-relaxed" style="color:#155b83;font-size:14px;">Share vibrant reflections on your Year 6 IPT teaching experience.</span>
            <span class="relative z-10 mt-3 inline-flex items-center gap-2 font-bold"><i data-lucide="sparkles" aria-hidden="true"></i><span style="color:#073d67;font-size:15px;">Give Year 6 feedback</span></span>
          </button>
          <button id="open-year7" type="button" class="menu-option rounded-[26px] px-5 py-4 text-left shadow-2xl" style="background:linear-gradient(135deg,#1e4f96,#3179b9);color:#effcff;">
            <span class="relative z-10 block font-bold uppercase tracking-[.14em]" style="color:#9decE5;font-size:13px;">Reflect and refine</span>
            <span class="relative z-10 mt-2 block font-semibold" style="color:#f4f9ff;font-weight:700;font-size:30px;">Year 7</span>
            <span class="relative z-10 mt-2 block leading-relaxed" style="color:#d6e4f7;font-size:14px;">Continue to the familiar Year 7 IPT feedback experience.</span>
            <span class="relative z-10 mt-3 inline-flex items-center gap-2 font-bold"><i data-lucide="arrow-right" aria-hidden="true"></i><span style="color:#effcff;font-size:15px;">Give Year 7 feedback</span></span>
          </button>
        </section>
      </div>
    </div>
  </main>

  <!-- The two form views are generated by script.js from the config at the top of that file -->
  <div id="year6-view" class="view year6-theme"></div>
  <div id="year7-view" class="view"></div>

  <script src="script.js"></script>
  <script src="calendar.js"></script>
  <script id="meeting-status">
    /* Live "next meeting" line for the meetings box. Times come from the data-* attributes on the rows above. */
    (function () {
      const card = document.querySelector(".meet-card");
      if (!card) return;
      const TZ = "Europe/Istanbul";                       // meeting times are read in this time zone
      const sub = card.querySelector(".meet-sub"), btn = card.querySelector(".meet-btn");
      const SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
      const W = 7 * 1440;
      const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
      const rows = [...card.querySelectorAll(".meet-row[data-start]")];
      const slots = rows.map(row => {
        const day = SHORT.indexOf(row.dataset.day);
        return { row, day, label: row.querySelector(".meet-chip").textContent.trim(),
                 startTxt: row.dataset.start, endTxt: row.dataset.end,
                 start: day * 1440 + toMin(row.dataset.start), end: day * 1440 + toMin(row.dataset.end) };
      });

      /*compute-start*/
      function compute(now, slots) {
        const live = slots.find(s => now >= s.start && now < s.end);
        if (live) return { live: true, slot: live, diff: 0 };
        let best = null;
        for (const s of slots) {
          let d = s.start - now; if (d <= 0) d += W;
          if (!best || d < best.diff) best = { live: false, slot: s, diff: d };
        }
        return best;
      }
      function describe(now, r) {
        const s = r.slot;
        if (r.live) return `${s.label} meeting is live now \u00b7 until ${s.endTxt}`;
        if (r.diff <= 180) {
          const h = Math.floor(r.diff / 60), m = r.diff % 60, p = [];
          if (h) p.push(h + " h"); if (m || !h) p.push(m + " min");
          return `Next: ${s.label} meeting in ${p.join(" ")}`;
        }
        const nowDay = Math.floor(now / 1440) % 7, ahead = (s.day - nowDay + 7) % 7;
        if (r.diff < 1440 && ahead === 0) return `Next: ${s.label} meeting today at ${s.startTxt}`;
        if (r.diff < 2880 && ahead === 1) return `Next: ${s.label} meeting tomorrow at ${s.startTxt}`;
        return `Next: ${s.label} meeting \u00b7 ${LONG[s.day]} ${s.startTxt}`;
      }
      /*compute-end*/

      function nowInTZ() {                                // minutes since Monday 00:00 in the meeting time zone
        let d = new Date(), day, hh, mm;
        try {
          const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d);
          const g = t => p.find(x => x.type === t).value;
          day = SHORT.indexOf(g("weekday")); hh = Number(g("hour")) % 24; mm = Number(g("minute"));
        } catch (e) { day = (d.getDay() + 6) % 7; hh = d.getHours(); mm = d.getMinutes(); }
        return day * 1440 + hh * 60 + mm;
      }

      function update() {
        const now = nowInTZ(), r = compute(now, slots);
        if (!r) return;
        sub.textContent = "";
        if (r.live) { const dot = document.createElement("span"); dot.className = "meet-dot"; sub.appendChild(dot); }
        sub.appendChild(document.createTextNode(describe(now, r)));
        slots.forEach(s => s.row.classList.remove("is-live", "is-next"));
        if (r.live) r.slot.row.classList.add("is-live");
        else if (r.diff < 1440) r.slot.row.classList.add("is-next");
        btn.classList.toggle("is-soon", r.live || r.diff <= 15);
      }
      update();
      setInterval(update, 30000);
      document.addEventListener("visibilitychange", update);
    })();
  </script>
  <script id="fit-viewport">
    /* Shrinks the home page just enough to fit the screen height (desktop only), so it never scrolls.
       On tall screens nothing changes. */
    (function () {
      const main = document.getElementById("menu-view");
      const layout = main && main.querySelector(".menu-layout");
      if (!layout) return;
      function fit() {
        layout.style.zoom = "";
        if (window.innerWidth < 1024 || !layout.offsetHeight) return;
        const cs = getComputedStyle(main);
        const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
        const z = (window.innerHeight - pad - 2) / layout.getBoundingClientRect().height;
        if (z < 1) layout.style.zoom = Math.max(z, 0.5);
      }
      window.addEventListener("resize", fit);
      window.addEventListener("load", fit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      new MutationObserver(fit).observe(main, { attributes: true, attributeFilter: ["class"] });
      fit();
    })();
  </script>
</body>
</html>
